name: Refresh content

on:
  schedule:
    - cron: '17 * * * *' # hourly; GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator only uses Node built-ins, so no npm install.
      - run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # A commit here triggers the Vercel redeploy.
      - run: |
          git diff --quiet content/ && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -am 'content: sync from GitHub'
          git push
